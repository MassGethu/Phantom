[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdev"
version = "0.1.0"
description = "Find undocumented setup assumptions in README commands"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.12", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ghost = "ghostdev.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: integration tests requiring a running Docker daemon"]
